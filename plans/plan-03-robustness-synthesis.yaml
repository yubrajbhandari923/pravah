- key: e20-audit-release
  title: Independent replication, final review and research-ready release
  question: >-
    Are the data, software, report and claims reproducible by someone who did not develop the algorithms?
  hypothesis: >-
    A clean-environment rerun, independent critical review and artifact provenance audit will expose undocumented
    dependencies and unsupported claims before a journal submission.
  method: >-
    Clean pip/uv install, seeded representative reruns, registered artifacts, Quarto HTML build, license/security/README/data
    availability audit, reproducibility bundle and reviewed outcome with explicit unresolved issues.
  metrics:
  - rerun_error
  - open_issue_count
  - artifact_manifest_coverage
  - quarto_build_pass
  - source_release_readiness
  literature: >-
    [raanes2024] https://doi.org/10.21105/joss.05150; [desilva2021] https://doi.org/10.21105/joss.02828; [green2006]
    https://repository.rice.edu/items/4d4b4f81-1c4b-4362-8513-685eac332c7c.
  steps:
  - title: Independent clean-env replication of representative runs
    intent: >-
      With a fresh Python environment and only documented dependencies, run a small independent numerical oracle,
      one source inverse, one placement comparison, one causal forecast and one imperfect-wind scenario from published
      configs/seeds. Compare outputs against recorded numeric tolerances, inspect git SHA and version provenance.
      Do not update golden numbers without scientific review. Record unresolved discrepancies, reproducibility status
      and exact commands.
  - title: Independent scientific peer-review simulation
    intent: >-
      Review full Quarto report as a skeptical reviewer: Does it reproduce established papers fairly? Are FIM and
      GP/footprint claims mathematically sound? Are tests independent? Is source/time basis identifiable? Is forecasting
      causal? Do placements share data budgets? Is uncertainty calibrated? Are statistical intervals correct and
      sample units independent? Are negative results shown? Is real-world modeling qualified? Enumerate major/minor
      issues and rank severity; do not silently fix scientific assumptions.
  - title: Address mandatory reviewer issues or document honest blockers
    intent: >-
      Fix code/documentation bugs only with frozen tests unchanged, rerun affected results and supersede previous
      figures with evidence; any change to hypotheses, data splits, metrics, or solver physics needs fresh human
      scientific approval and a new experiment proposal. Keep a reviewer-response table and add unresolved limitations
      in report. No fabricated outcomes or fake approvals.
  - title: Produce methods/reproduction release and journal handoff checklist
    intent: >-
      Finalize clean README, pinned environment/lock, user guide, dataset acquisition manifest, runtime budgets
      and run commands for small local example and optional HPC replay. Build Quarto HTML and audit citations/links/figures;
      prepare human-readable manuscript handoff with final primary endpoint table, figures and appendix candidates.
      Run `research doctor --all`, `research guide status`, `research report`; create supported findings only after
      independent review. DO NOT automatically push, publish, merge or submit anything: prepare promotion candidates
      for human approval.
  - title: Final technical readiness audit; author scientific sign-off pending
    intent: >-
      Present final evidence index, Quarto result coverage, reproducibility status, reference audit, negative findings,
      skipped conditional tasks, unresolved blockers and remaining journal-specific formatting. Produce a complete
      evidence-based readiness report and mark final scientific/author sign-off as PENDING HUMAN REVIEW. The technical
      reporting task may finish without a human present, but must never claim manuscript approval, submission, publication
      or field validation. Record open issues and any proposed promotion separately; do not approve scientific claims.
  expected_artifacts:
  - docs/research/final-reproducibility-audit.md
  - docs/research/final-scientific-review.md
  - docs/research/reviewer-responses.md
  - docs/research/journal-readiness-checklist.md
  - docs/research/release-manifest.md
  - reports/quarto/chapters/20-reproducibility.qmd
  - docs/research/gates/gate-20-final.md
