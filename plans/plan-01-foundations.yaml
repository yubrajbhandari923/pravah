# Scientific intent for PRAVAH stage 1. Read-only by default; not a progress log (see state/).
# Distilled from the ResearchOS plan (original: git show refs/legacy/heads/main:plans/01-foundations.yaml).
# expected_artifacts are advisory evidence targets, not completion gates.
plan: pravah-p1-foundations
title: PRAVAH P1 — Registered protocol, verified transport, benchmark, and static inverse
objective: >-
  Establish the registered 2D passive-tracer protocol, independently tested FiPy forward model, leakage-free synthetic
  benchmark, and nonnegative source-reconstruction baseline.
success_criteria: >-
  E00–E03 implemented with local evidence, independent numerical/claim review documents and registered artifacts;
  all tasks verified and all authorized code promotions settled. This is a synthetic testbed, not observed-PM2.5
  validation.
experiments:
- key: e00-protocol
  title: Protocol, literature replication map and frozen evaluation contract
  question: >-
    What precise claims, data splits, endpoints, assumptions and stopping rules will this benchmark test?
  hypothesis: >-
    A pre-registered, bounded benchmark can separate numerical validity, identifiable parameters, field reconstruction
    and forecasting without changing evaluation metrics after observing outcomes.
  method: Literature ledger and protocol design; no numerical results claimed.
  metrics:
  - predefined_endpoints
  - protocol_coverage
  - test_split_leakage_audit
  literature: >-
    [green2006] https://repository.rice.edu/items/4d4b4f81-1c4b-4362-8513-685eac332c7c; [bhardwaj2026] https://arxiv.org/abs/2608.00050;
    [manohar2018] https://doi.org/10.1109/MCS.2018.2810460; [choi2026] https://doi.org/10.1088/1748-9326/ae2b89;
    [raanes2024] https://doi.org/10.21105/joss.05150.
  steps:
  - title: Audit relevant papers, code, licenses and reproduce targets
    intent: >-
      Read docs/research/phase1-proposal.md and the papers identified in docs/research/literature-map.md. Open the
      actual Rice 2006 thesis (local path in docs/papers if available), and extract Green Ch. 2.2-2.3, 3 and Appendix
      A formulas, assumptions, optimization criteria and numerical example. Read Bhardwaj 2026 on identifiability;
      Choi 2026 on value of information; Manohar 2018 and PySensors on reconstruction; DAPPER on twin-experiment
      diagnostics. For each distinguish exact paper result vs PRAVAH adaptation; do not invent replication precision.
      Document selected baseline algorithms and license/reuse policy with upstream links and versions. Only use
      a paper's code subject to its license; BLDFM noncommercial code is for conceptual/validation reference unless
      separately approved.
  - title: Define governing assumptions and pre-register scientific endpoints
    intent: >-
      Write docs/research/preregistered-protocol.md specifying: 2D rectangular depth-averaged passive tracer (not
      true PM2.5), units and normalized source basis; boundary/initial conditions; time integration; noise and correlated-noise
      variants; source and background model; parameter/field/forecast/exposure metrics; 2/4/8 source scenarios;
      sensor budgets 2/4/8/16/32; window lengths snapshot/6h/24h/7d; repetitions and seeds; train/validation/test
      calendar split; held-out wind regimes; optional exposure weighted outcome. Distinguish assessment of identifiability
      from prediction accuracy. Define one PRIMARY endpoint (held-out pre-assimilation field forecast RMSE at one-step
      horizon, plus declared timing window) and ranked SECONDARY endpoints (source RMSE, post-analysis field error,
      probability calibration, population-weighted error). Set success/stop rules that allow negative findings.
  - title: Create reproducible experiment/report contracts
    intent: >-
      Implement a typed experiment configuration schema and provenance writer: config files, data manifest, deterministic
      seeds, physics units, simulated truth IDs, run IDs, metric definitions and no-leak split. Add reports/quarto
      project with chapters per experiment and a build script that consumes small versioned summary tables/figures.
      Keep Research OS Scientist Guide distinct: it is a curated guide, NOT the comprehensive research report. Do
      not overwrite files generated by Research OS. Define local vs HPC resource profiles and correct output registration.
  - title: Independent protocol audit and freeze of acceptance tests
    intent: >-
      Independently inspect proposed outcomes, hidden truth separation, bias/noise assumptions, boundary/source
      units, reference accuracy, compute budgets, planned ablations and Quarto evidence. Independently audit preregistration
      against the researcher-approved plan; freeze numerical oracle tests through Research OS before implementation.
      Record accepted-for-execution, deferred, and blocked items in a decision log, without claiming a new human
      scientific approval. If changes to the scientific design are necessary, report scientific_assumption and stop
      instead of changing the protocol.
  expected_artifacts:
  - docs/research/literature-replication.md
  - docs/research/preregistered-protocol.md
  - src/pravah/experiment_config.py
  - tests/test_experiment_config.py
  - reports/quarto/_quarto.yml
  - reports/quarto/index.qmd
  - docs/research/reproducibility-contract.md
  - docs/research/gates/gate-00-protocol.md
- key: e01-forward
  title: Verify 2D advection-diffusion-removal and physical units
  question: Does the numerical forward solver solve the declared PDE accurately and reproducibly?
  hypothesis: >-
    A stable FiPy implementation will converge to independently specified reference solutions and satisfy mass balance/nonnegativity
    within justified discretization tolerances.
  method: >-
    Use FiPy FVM on 32² then 64² grid, analytical/manufactured solutions and exact integral constraints; never use
    inverse-generated truth as numerical oracle.
  metrics:
  - L2_grid_error
  - convergence_order
  - mass_residual
  - minimum_concentration
  - runtime_seconds
  planned_runs: 10
  literature: >-
    [pennington2024] https://doi.org/10.5194/acp-24-2345-2024; [schlutow2026] https://doi.org/10.5194/gmd-19-6259-2026.
  steps:
  - title: Derive continuum and discrete PDE plus independent tests
    intent: >-
      From the preregistration derive conservative 2D equation, consistent depth-averaging, source-strength units,
      inflow/outflow/periodic/no-flux choices and initial/boundary conditions. Decide whether wind field is divergence
      free; document how nonzero divergence is treated. Define independent exact or manufactured solutions for (i)
      pure diffusion, (ii) uniform-wind Gaussian pulse, (iii) exponential decay and (iv) forcing with prescribed
      integral mass. Write physically derived expected convergence, no hard-coded fit tolerances from observed results.
      Include refs Schlutow 2026 for footprints/transport, Pennington 2024 only for higher-fidelity omitted physics.
  - title: Implement FiPy forward solver and geometry contracts
    intent: >-
      Implement FiPy-based 2D forward simulator in src/pravah/forward.py using one normalized source term, regular
      rectangular Cartesian grid, known wind/diffusion/loss, explicit boundary conditions. Use small CPU; write
      tests for shape, units, boundary flux, nonnegative source, and observation mesh interpolation. Keep FiPy an
      external solver dependency; do not implement a second PDE engine. Make step state explicit and deterministic,
      suitable for a linear state-space representation later.
  - title: Local numerical convergence, mass budget and benchmark figures
    intent: >-
      Run 16²/32²/64² tiny cases locally for manufactured/analytic solutions; check time-step refinement and advection-dominated
      CFL/Peclet sensitivity; produce conservation plot, pulse snapshots, convergence table. Diagnose numerical
      diffusion and negative overshoots. Record real RMSE and tolerance rationale in registered run; fail/report
      if not convergent.
  - title: Independent numerical verifier gate
    intent: >-
      Review PDE against source code, truth/oracle independence, dimensional consistency, convergence on 3 grids
      and no unsupported real PM2.5 claims. Freeze verification tests. Clearly record failure/negative cases. Require
      human approval before unfreezing any physics assumptions.
  expected_artifacts:
  - docs/research/pde-and-discretization.md
  - tests/test_forward_oracles.py
  - src/pravah/forward.py
  - tests/test_forward_verification.py
  - reports/quarto/chapters/01-forward.qmd
  - reports/quarto/tables/e01-verification.csv
  - reports/quarto/figures/e01-convergence.png
  - docs/research/gates/gate-01-forward.md
- key: e02-benchmark
  title: Reproducible synthetic truth, sensors and temporal scenarios
  question: >-
    Can a reusable and leakage-free synthetic benchmark support all subsequent fair comparisons?
  hypothesis: >-
    Holding forward truth and noise draws fixed across designs will isolate placement effects from stochastic variation.
  method: >-
    Construct 2D bounded reference scenes with Gaussian/tile sources, 2–8 source coefficients, static and time-varying
    winds, fixed candidate sensor grid, observation noise and hidden full-field truth; use independent seeds and
    train/val/test scenarios.
  metrics:
  - truth_manifest_completeness
  - measurement_operator_error
  - split_leak_count
  planned_runs: 20
  literature: >-
    [green2006] https://repository.rice.edu/items/4d4b4f81-1c4b-4362-8513-685eac332c7c; [bhardwaj2026] https://arxiv.org/abs/2608.00050;
    [raanes2024] https://doi.org/10.21105/joss.05150.
  steps:
  - title: Specify truth generator, source basis, noise and seed policy
    intent: >-
      Define source basis shapes with normalized integrals and positive strengths, effective mixing height convention,
      background and inflow baseline, wind protocols and observability test cases. Design train/validation/test
      splits by independent wind realization/day/source scenarios; no use of test truth for placement or tuning.
      Pre-select the candidate sensor lattice with exclusion mask; define k=2/4/8/16/32. Include perfect-model and
      separately labeled imperfect-model truth. Publish actual deterministic seed manifest.
  - title: Implement truth, measurements and split manifest
    intent: >-
      Create src/pravah/benchmarks.py and observations.py, with complete truth including full field, sources, winds
      and accessible all-candidate simulated observations stored separately from the inference API. Unit-test observation
      at grid centers and between cells, noise injection/heteroscedasticity and same-seed fairness. Enforce split
      IDs programmatically. Do not leak truth or withheld sensor readings to inverse methods.
  - title: Run and inspect tiny benchmark locally
    intent: >-
      Generate 3 small local examples: well-separated 2-source, collinear/ambiguous 2-source, and 4-source with
      changing wind. Produce maps of true emissions, concentration plume, candidate sensor values, wind arrows,
      and temporal series. Verify mass/unit consistency, no leakage, manifest versioning and identical truth across
      candidate designs.
  - title: Freeze benchmark version and hidden-test conditions
    intent: >-
      Review truth/operator consistency, split assignment and independent sources of randomness; record known weaknesses,
      immutable test design, supported source counts/window length and computational budget. Require approved version
      bumps for any subsequent data-definition change.
  expected_artifacts:
  - configs/benchmark-v1.yaml
  - docs/research/truth-design.md
  - src/pravah/benchmarks.py
  - tests/test_benchmarks.py
  - reports/quarto/chapters/02-benchmark.qmd
  - reports/quarto/figures/e02-truth-panels.png
  - reports/quarto/tables/e02-splits.csv
  - docs/research/gates/gate-02-benchmark.md
- key: e03-static-inverse
  title: Static constrained source-strength inverse baseline
  question: >-
    Can sparse sensor measurements identify 2–8 known source amplitudes with correct meteorology?
  hypothesis: >-
    Correctly specified and sufficiently observable configurations allow nonnegative source recovery; underdetermined
    cases admit nonunique solutions.
  method: >-
    Build influence/sensitivity matrix using finite differences or impulse response; validate linearity; compare
    NNLS to weighted/ridge NNLS, background nuisance; recover source coefficients and full concentration field.
  metrics:
  - source_relative_rmse
  - field_rmse
  - measurement_fit
  - parameter_bias
  - estimated_condition
  planned_runs: 30
  literature: >-
    [green2006] https://repository.rice.edu/items/4d4b4f81-1c4b-4362-8513-685eac332c7c; [bhardwaj2026] https://arxiv.org/abs/2608.00050;
    [mons2017] https://doi.org/10.1016/j.jweia.2017.07.007.
  steps:
  - title: Derive source-response operator and weighted nonnegative inverse
    intent: >-
      Derive y=G(theta)+epsilon from the actual transient PDE and observation schedule (include source release history/transport
      lag, not instantaneous footprint only). Identify when response is linear in source amplitude and how background
      enters. Implement paper-referenced NNLS/regularization objective, noise covariance weights and distinguish
      inferred sources vs field. Document sensitivity propagation and normalization. Main refs Green 2006 Ch 2.2
      and Bhardwaj 2026 low-dimensional source fingerprints.
  - title: Implement sensitivity operator, NNLS and independent low-dimensional oracle
    intent: >-
      Implement src/pravah/inverse.py, src/pravah/sensitivity.py and unit tests. Compare source coefficient recovery
      to a tiny hand-computed linear inverse; check superposition H(aq1+bq2)=aH(q1)+bH(q2) only under fixed linear
      physics; check NNLS respects constraints. Test coherent and rank deficient matrices explicitly. Distinguish
      source coefficient model from any time-varying background nuisance.
  - title: Local source recovery under known wind
    intent: >-
      Run 2/4/8 sources with 2/4/8 sensors, 3 seeds and independent noise levels on 32² domain. Pre-report measurement
      fit, parameter RMSE and inferred field RMSE, including an intentionally non-identifiable case and correctly
      characterized failures. Compare unweighted vs noise-weighted and background-known vs estimated nuisance if
      specified.
  - title: Review inverse truth separation and baseline reproducibility
    intent: >-
      Independently audit source truth use, nonnegative prior, optimization convergence and relative metrics when
      true source has zero strength. Confirm all claims from logged runs. Record failure modes and error floors;
      freeze inversion baseline for fair placement comparisons.
  expected_artifacts:
  - docs/research/inverse-derivation.md
  - src/pravah/sensitivity.py
  - src/pravah/inverse.py
  - tests/test_source_inversion.py
  - reports/quarto/chapters/03-inverse.qmd
  - reports/quarto/figures/e03-source-estimates.png
  - reports/quarto/tables/e03-inversion.csv
  - docs/research/gates/gate-03-inverse.md
