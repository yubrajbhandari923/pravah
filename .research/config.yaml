# Research project configuration (human-editable).
# Only settings that differ from the inherited defaults are listed here.
#   research config show --effective    every value actually in force
#   research config show --sources      where each value comes from
#   research config check               validate this file
# Comments and ordering are preserved: Research OS rewrites only the keys it is asked to change.

project:
  name: pravah
  description: ''
  goal: Simulate the air pollution field evolution
  created_at: '2026-10-10T00:33:02-04:00'
  git_repo: null
hpc:
  clusters:
    duke:
      project:
        slug: pravah
  bundle:
    # Added to the default exclude list. results/ is 2.1 GB of registered evidence and data/ holds the
    # datasets: neither is source, and both belong on the cluster (shared_data) or nowhere near a bundle.
    exclude:
      - .git
      - .research
      - __pycache__
      - '*.pyc'
      - .venv
      - venv
      - node_modules
      - .mypy_cache
      - .pytest_cache
      - .DS_Store
      - '*.egg-info'
      - .ipynb_checkpoints
      # Not all of results/: scripts/compare_runs.py needs the 3.8 MB solver-regression baseline on the
      # cluster to run the FiPy regression gate there. Only the heavy evidence dirs are excluded.
      - results/phase3-*
      - results/geodesign-robust
      - results/belauri-forward
      - results/transboundary-rerun
      # NOT results/geodesign itself: EXP-015 stage 2 reads its frozen alpha_selected.json and
      # noise_levels.csv (4.6 KB together). Only its two 29 MB raw ensembles are dropped.
      - results/geodesign/validation_raw.csv
      - results/geodesign/test_raw.csv
      - data
      - notebooks
      - tools
  collect:
    # User instruction (2026-10-12): do not pull big datasets off the cluster — only analysed results.
    # Anything larger stays on the cluster and is recorded by remote path + size + sha256, so a big
    # .npz field dump is never silently downloaded. Raise it only after checking with the user.
    max_artifact_bytes: 268435456   # 256 MB per artifact

