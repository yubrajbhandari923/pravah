[project]
name = "pravah"
version = "0.1.0"
description = "Sparse-sensor air quality reconstruction under uncertain meteorology and emissions"
requires-python = ">=3.12"
dependencies = ["fipy", "numpy", "scipy", "pandas", "xarray", "matplotlib", "pyyaml", "pydantic", "pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "python-sensors>=0.4.3",
]
