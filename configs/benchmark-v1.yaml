observability_cases:
  O1_rank_deficient:
    K: 4
    k: 2
    window: snapshot
    expect: rank <= 2 < K (structural)
  O2_upwind_blind:
    K: 2
    k: 4
    window: 24h
    wind: steady_westerly
    setup: all sensors west of all sources
    expect: weighted-Jacobian numerical rank 0 at tol 1e-8
  O3_close_pair:
    K: 2
    k: 2
    window: snapshot
    setup: two sources 1.5 km apart, sensors on the perpendicular bisector
    expect: ill-conditioned; condition number reported, no recovery claim
  O4_well_posed:
    K: 2
    k: 32
    window: 24h
    expect: full rank, noiseless recovery within 1e-6 relative
  note: expectations are predictions to be tested in E03, not results
metrics:
- name: forecast_rmse_1h_preassim
  unit: ug m^-3
  primary: true
- name: source_rmse_rel
  unit: '1'
  primary: false
- name: analysis_rmse
  unit: ug m^-3
  primary: false
- name: interval_coverage
  unit: '1'
  primary: false
- name: popweighted_rmse
  unit: ug m^-3
  primary: false
design:
  n_sources:
