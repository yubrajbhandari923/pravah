# Generated by a T-009 run; deterministic. Do not hand-edit.
schema: pravah-benchmark-v1
experiment: EXP-003
status: APPROVED 2026-11-12 with the protocol (amendable baseline; state/decisions/2026-11-12-protocol-approval.md)
scope: synthetic 2-D depth-averaged passive tracer; not PM2.5, not real exposure
protocol_ref: docs/research/preregistered-protocol.md
truth:
  model:
    domain_m:
    - 10000.0
    - 10000.0
    grid:
    - 64
    - 64
    dt_s: 300
    K_m2_s: 50.0
    lambda_s: 2.3148148148148147e-05
    mixing_depth_m: 500.0
    spinup_h: 48
    bc: study (docs/research/pde-and-discretization.md)
  units:
    length: m
    time: s
    concentration: ug m^-3
    emission_rate: ug s^-1
    areal_flux: ug m^-2 s^-1
  source_basis:
    shape: isotropic_gaussian
    sigma_m: 400.0
    truncate_sigma: 3
    normalisation: 'discrete: sum(phi_i * dx * dy) = 1 over the domain after truncation and clipping at walls'
    emission_areal_ug_m2_s: a_k * g_k(t) * phi_k
    depth_averaged_source: q / mixing_depth_m
    strength:
      unit: ug s^-1
      distribution: a_ref * LogUniform(lo, hi)
      a_ref_ug_s: 1000000.0  # amendment A1, 2026-11-12 (was 100.0); hand-edited
      lo: 0.5
      hi: 5.0
      positive: true
    temporal:
      base: g=1
      variant_diurnal: g=1+0.5 sin(2 pi (t - t_k)/24h), t_k ~ U(0,24h)
    location_lattice:
    - 12
    - 12
    centre_rule: ((a+0.5)L/12, (b+0.5)L/12)
    min_separation_m: 1500.0
    location_draw: greedy over rng.permutation(144), accept if >= min_separation from accepted
    n_sources:
    - 2
    - 4
    - 8
  background:
    c_bg_ug_m3: 5.0
    uniform: true
    initial_condition: c = c_bg
    inflow_boundary: Dirichlet c = c_bg
    variant_unknown_background:
      b: N(5, 1^2)
      estimated_as_extra_parameter: true
  population_weight:
    kind: synthetic 3-Gaussian mixture, normalised to sum 1 over cells
    seed: 6000
    components:
    - centre_m:
      - 3616.6
      - 3867.3
      sigma_m: 1465.7
      weight: 0.312323
    - centre_m:
      - 6328.4
      - 4128.5
      sigma_m: 2030.4
      weight: 0.414213
    - centre_m:
      - 2017.3
      - 3977.0
      sigma_m: 1128.2
      weight: 0.273465
  perfect_model:
    label: PERFECT
    description: truth generated with exactly the nominal model the estimator uses
    primary: true
  imperfect_model:
    label: IMPERFECT
    primary: false
    used_by: E12/E13 only; never the primary endpoint
    variants:
      wind_direction_bias:
        truth_wind_rotation_deg: 15.0
      wind_speed_bias:
        truth_wind_speed_factor: 1.2
      removal_mismatch:
        truth_lambda_s: 3.472222222222222e-05
      diffusivity_mismatch:
        truth_K_m2_s: 100.0
      grid_mismatch:
        truth_grid:
        - 128
        - 128
        estimator_grid:
        - 64
        - 64
      source_shape_mismatch:
        truth_sigma_m: 300.0
        estimator_sigma_m: 400.0
    rule: truth uses the perturbed value; the estimator always receives the nominal value; one variant at a time
    perturbation_seed: 7000 + s (reserved; variants above are deterministic offsets)
winds:
  convention: direction = meteorological 'from' angle, degrees clockwise from north; ux=-s sin(theta), uy=-s cos(theta)
  hourly_piecewise_constant: true
  block_h: 48
  block_regime: regime_list[block_index mod 3]
  speed_clip_m_s:
  - 0.2
  - 5.0
  regimes:
    steady_westerly:
      split: train/validation
      speed: 3.0
      dir_deg: 270.0
    veering:
      split: train/validation
      speed: 3.0
      dir_deg: 270 -> 315 linear over hours 0-12, then 315
    weak_variable:
      split: train/validation
      speed: U(0.5,1.5) per 6 h
      dir_deg: 270, +180 flip every 6 h
    steady_southerly:
      split: test
      speed: 4.0
      dir_deg: 180.0
    stagnation_then_front:
      split: test
      speed: U(0.2,0.5) hours 0-23; 3.0 hours 24-47
      dir_deg: 270 hours 0-23; 0 hours 24-47 (90 deg shift)
    diurnal_rotation:
      split: test
      speed: 2.0
      dir_deg: phi + 360*t/24h, phi ~ U(0,360)
  perturbation: 'per block: speed *= U(0.8,1.2), direction += N(0, 10 deg); steady and variable regimes only perturb
    as stated'
  train_regimes: &id001
  - steady_westerly
  - veering
  - weak_variable
  heldout_regimes: &id002
  - steady_southerly
  - stagnation_then_front
  - diurnal_rotation
  wind_seed: 5000 + 100*segment_index + s  (train 0, validation 1, test 2)
splits:
  unit: calendar days after spin-up, 1-based inclusive
  train:
  - 1
  - 30
  validation:
  - 31
  - 42
  test:
  - 43
  - 60
  wind_regimes:
    train: *id001
    validation: *id001
    test: *id002
  independence:
  - distinct wind realization seed per segment
  - test regimes disjoint from train/validation regimes
  - source scenarios are independent across replicates s but shared across segments within s
  forbidden: test truth, test winds or test observations for placement, tuning or model selection
sensors:
  site_lattice:
    n:
    - 16
    - 16
    cell_index: 2 + 4 i (i,j = 0..15) on the 64x64 grid
    spacing_m: 625.0
    site_xy_m: ((2+4i+0.5) dx, (2+4j+0.5) dy)
    total_sites: 256
  static_exclusion: outer ring i or j in {0,15} excluded
  static_admissible_sites: 196
  scenario_exclusion: sites within 400.0 m of a true source centre excluded (source locations are known)
  min_separation_m: 1250.0
  budgets_k:
  - 2
  - 4
  - 8
  - 16
  - 32
  worst_case_admissible_sites: 187
  random_baseline:
    networks_per_scenario: 10
    rule: greedy over rng.permutation(admissible), separation constraint
    seed: SeedSequence([placement_seed, K, k, r])
    sha256_of_all_networks: d452c1fef036cf2e6f286677e43b65357a2e272c652fca35ed011d165635ff87
    networks_short_of_k: []
noise:
  white:
    sigma: 0.05 * median train-period truth concentration at the 256 candidate sites, per scenario
    seed: SeedSequence(noise_seed).spawn(2)[0]
  ar1:
    rho_hourly: 0.8
    same_marginal_sigma: true
    spatially_independent: true
    seed: SeedSequence(noise_seed).spawn(2)[1]
  draw_rule: one array of shape (256 sites, 1440 h) per (s, K), C order; designs index into it, so every placement
    sees identical noise at a shared site
  independent_of_truth: true
