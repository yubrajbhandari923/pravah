# PRAVAH research report (Quarto book). Tables and figures are written by scripts/ (eNN_*.py, report_*.py).
project:
  type: book
  output-dir: _build
book:
  title: "PRAVAH: sparse low-cost sensor placement under uncertain wind"
  subtitle: "Plans 1–3 research report (E00–E18), synthetic 2-D benchmark"
  date: "2026-11-14"
  chapters:
    - index.qmd
    - chapters/00-background.qmd
    - chapters/00-methods.qmd
    - part: "Experiments"
      chapters:
        - chapters/e00-protocol.qmd
        - chapters/01-forward.qmd
        - chapters/02-benchmark.qmd
        - chapters/03-inverse.qmd
        - chapters/04-footprints.qmd
        - chapters/05-time.qmd
        - chapters/06-placement-methods.qmd
        - chapters/07-cross-objective.qmd
        - chapters/08-sufficiency.qmd
        - chapters/09-filter.qmd
        - chapters/10-joint.qmd
        - chapters/11-forecast-design.qmd
        - chapters/12-wind-mismatch.qmd
        - chapters/13-model-mismatch.qmd
        - chapters/14-reliability.qmd
        - chapters/15-robust.qmd
        - chapters/16-generalization.qmd
        - chapters/17-regional.qmd
    - chapters/19-conclusions.qmd
    - chapters/90-lessons.qmd
    - chapters/91-next.qmd
    - chapters/references.qmd
bibliography: references.bib
format:
  html:
    theme: cosmo
    toc: true
execute:
  echo: false
  warning: false
  freeze: false
